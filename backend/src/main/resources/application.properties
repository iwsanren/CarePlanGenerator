# Application Name
spring.application.name=careplan-backend

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/careplan
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# LLM API Configuration
# provider: openai | claude | local
llm.provider=${LLM_PROVIDER:openai}

# OpenAI settings
llm.api.key=${LLM_API_KEY:your-openai-api-key-here}
llm.api.url=https://api.openai.com/v1/chat/completions
llm.openai.model=${LLM_OPENAI_MODEL:gpt-3.5-turbo}

# Claude settings (only needed when llm.provider=claude)
llm.claude.api.key=${CLAUDE_API_KEY:}
llm.claude.api.url=${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
llm.claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-latest}

# Mock
llm.mock.enabled=${LLM_MOCK_ENABLED:true}

# Timeout of one LLM request (OpenAI, Claude). The Kafka consumer settings below depend on it.
llm.request-timeout=${LLM_REQUEST_TIMEOUT:60s}

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Care plan queue: redis (default) | kafka. In redis mode no Kafka bean is created at all.
# kafka mode: orders are written to an outbox, sent to Kafka and generated by the Kafka consumer.
careplan.queue.type=${CAREPLAN_QUEUE_TYPE:redis}

# Kafka (read only when careplan.queue.type=kafka). localhost:29092 is the port docker compose publishes to the host.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
careplan.kafka.topics.requested=careplan.requested
careplan.kafka.topics.requested-dead-letter=careplan.requested.dlt
# Both topics get the same layout. A single local broker can only hold one replica; use 3 in a real cluster.
careplan.kafka.partitions=${CAREPLAN_KAFKA_PARTITIONS:3}
careplan.kafka.replication-factor=${CAREPLAN_KAFKA_REPLICATION_FACTOR:1}

# Kafka producer. delivery.timeout.ms must stay below careplan.outbox.send-timeout (a test asserts it): the producer
# has to give up on a message before the sender records it as failed, or it could still arrive and be sent again.
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=8000
spring.kafka.producer.properties[reconnect.backoff.max.ms]=10000
# While the broker is down the client logs every reconnect attempt (NetworkClient) and, many times a second,
# "Rebootstrapping" (Metadata). The outbox sender reports the outage itself, briefly.
logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.apache.kafka.clients.Metadata=WARN
# The consumer side: every fetch that fails against a stopped broker logs an INFO line with a stack trace.
logging.level.org.apache.kafka.clients.FetchSessionHandler=WARN
spring.kafka.consumer.properties[reconnect.backoff.max.ms]=10000

# Kafka consumer. The offset is committed after each record has been handled (ack-mode record, no auto commit).
spring.kafka.consumer.group-id=careplan-generator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# One thread per partition of careplan.requested.
spring.kafka.listener.concurrency=3
# One record can take minutes, so only one is fetched at a time.
spring.kafka.consumer.max-poll-records=1
# Worst case for one record: 3 LLM attempts x llm.request-timeout (60 s) + 2 s + 4 s back-off = 186 s, plus database
# work. max.poll.interval.ms must be larger, or Kafka hands the record to another consumer while it is still being
# processed. The claim lease must be at least as long as the poll interval. A test asserts both.
spring.kafka.consumer.properties[max.poll.interval.ms]=300000
careplan.claim.lease=360s
# A care plan is taken over (redelivery or expired lease) at most this often: 3 claims in total per request.
careplan.claim.max-reclaims=2
# Looks for PROCESSING plans whose lease has run out and that no message will bring back.
careplan.sweeper.interval=60s

# Outbox sender (kafka mode only)
careplan.outbox.poll-interval=1s
careplan.outbox.batch-size=50
careplan.outbox.send-timeout=10s
careplan.outbox.retention=7d
careplan.outbox.cleanup-cron=0 30 3 * * *

# Global error output policy: hide default message details from Spring's BasicErrorController.
# We return unified JSON via GlobalExceptionHandler.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Logging
logging.level.com.page24.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Monitoring (Day11)
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true


# Single-pharmacy employee authentication.
careplan.security.issuer=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/careplan}
careplan.security.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/careplan/protocol/openid-connect/certs}
careplan.security.audience=careplan-api
careplan.security.allowed-origins=${CAREPLAN_ALLOWED_ORIGINS:http://localhost:3000}
careplan.security.metrics-user=${METRICS_USER:monitor}
careplan.security.metrics-password=${METRICS_PASSWORD:local-monitor-only}
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI: off by default. Enable with the "docs" profile or
# SPRINGDOC_API_DOCS_ENABLED=true / SPRINGDOC_SWAGGER_UI_ENABLED=true.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring Batch: job metadata lives in PostgreSQL, tables are created by Flyway (V2__spring_batch_schema.sql).
# Never let Batch create tables itself and never run jobs at startup; jobs are launched explicitly.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
