# Application Name
spring.application.name=careplan-backend

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/careplan
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# LLM API Configuration
# provider: openai | claude | local
llm.provider=${LLM_PROVIDER:openai}

# OpenAI settings
llm.api.key=${LLM_API_KEY:your-openai-api-key-here}
llm.api.url=https://api.openai.com/v1/chat/completions
llm.openai.model=${LLM_OPENAI_MODEL:gpt-3.5-turbo}

# Claude settings (only needed when llm.provider=claude)
llm.claude.api.key=${CLAUDE_API_KEY:}
llm.claude.api.url=${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
llm.claude.model=${CLAUDE_MODEL:claude-3-5-sonnet-latest}

# Mock ???true = ???? LLM????????????/????
#            false = ??? LLM API???????
# ????????????LLM_MOCK_ENABLED=false
# ???mock ??????? local provider?????? llm.provider?
llm.mock.enabled=${LLM_MOCK_ENABLED:true}

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Global error output policy: hide default message details from Spring's BasicErrorController.
# We return unified JSON via GlobalExceptionHandler.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Logging
logging.level.com.page24.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Monitoring (Day11)
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true


# Single-pharmacy employee authentication.
careplan.security.issuer=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/careplan}
careplan.security.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/careplan/protocol/openid-connect/certs}
careplan.security.audience=careplan-api
careplan.security.allowed-origins=${CAREPLAN_ALLOWED_ORIGINS:http://localhost:3000}
careplan.security.metrics-user=${METRICS_USER:monitor}
careplan.security.metrics-password=${METRICS_PASSWORD:local-monitor-only}
management.endpoint.health.show-details=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
