version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: careplan-postgres
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan_user
      POSTGRES_PASSWORD: careplan_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careplan_user -d careplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis message queue
  redis:
    image: redis:7-alpine
    container_name: careplan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careplan-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database connection settings, matching the postgres service above
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careplan
      SPRING_DATASOURCE_USERNAME: careplan_user
      SPRING_DATASOURCE_PASSWORD: careplan_password
      # Redis settings
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # LLM API settings, loaded from .env
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      # Remote debugging settings
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "5005:5005"  # Debugging port
    restart: unless-stopped

  # Test container for running Maven tests in Docker
  backend-test:
    image: maven:3.9-eclipse-temurin-17-alpine
    container_name: careplan-backend-test
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: test
      LLM_MOCK_ENABLED: true
    entrypoint: ["sh", "-c", "chmod +x ./mvnw && ./mvnw -Dspring.profiles.active=test test"]

  # Prometheus scrapes Spring Boot metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: careplan-prometheus
    volumes:
      - ./src/main/resources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # Grafana visualizes metrics
  grafana:
    image: grafana/grafana:latest
    container_name: careplan-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  maven_cache:
  grafana_data:

