services:
  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-only}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-only}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
      CAREPLAN_ASSISTANT_PASSWORD: ${CAREPLAN_ASSISTANT_PASSWORD:-AssistantDemo123!}
      CAREPLAN_PHARMACIST_PASSWORD: ${CAREPLAN_PHARMACIST_PASSWORD:-PharmacistDemo123!}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/careplan-realm.json:/opt/keycloak/data/import/careplan-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: careplan-postgres
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan_user
      POSTGRES_PASSWORD: ${CAREPLAN_DB_PASSWORD:-careplan_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careplan_user -d careplan"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careplan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (one process is both broker and controller; no ZooKeeper). Local development
  # only: no authentication, one replica. The backend uses it only with CAREPLAN_QUEUE_TYPE=kafka.
  kafka:
    image: apache/kafka:4.1.1
    container_name: careplan-kafka
    # The name the broker advertises to other containers; it must resolve to this container.
    hostname: kafka
    environment:
      # As soon as one KAFKA_ setting is given, the image expects the whole broker configuration here.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client addresses: containers connect to kafka:9092, tools on this computer to localhost:29092.
      # 9093 is only for the controller and is not published.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Data goes to the volume (the image's own example writes to /tmp and loses everything with the container).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created by the application with the intended partition count, never as a side effect of a client.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Internal topics default to 3 replicas, which one broker cannot satisfy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep the JVM small enough for a laptop.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      # Bound to this computer only: the listener has no authentication.
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # The check tool is a JVM of its own; without its own limit it would inherit the broker's heap size.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careplan-backend
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/careplan
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/careplan/protocol/openid-connect/certs
      METRICS_USER: ${METRICS_USER:-monitor}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-local-monitor-only}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careplan
      SPRING_DATASOURCE_USERNAME: careplan_user
      SPRING_DATASOURCE_PASSWORD: ${CAREPLAN_DB_PASSWORD:-careplan_password}
      CAREPLAN_ALLOWED_ORIGINS: ${CAREPLAN_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # redis (default) or kafka. Set it in the shell that runs docker compose (or in a .env file next to this
      # file); the value here takes precedence over one in backend/.env. kafka mode does not generate care plans yet.
      CAREPLAN_QUEUE_TYPE: ${CAREPLAN_QUEUE_TYPE:-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Local demo only: serve /v3/api-docs and /swagger-ui/index.html (off by default in the app)
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careplan-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Container-to-container hostname, not localhost -- see vite.config.ts
      VITE_BACKEND_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    volumes:
      # Hot reload only source; dependencies always come from the rebuilt image.
      - ./frontend/src:/app/src
    restart: unless-stopped

volumes:
  keycloak_data:
  postgres_data:
  kafka_data:
